<style>

<script>
'use strict';
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false});
const TAU=Math.PI*2,QUERY=new URLSearchParams(location.search);
// ---- STYLE ---------------------------------------------------------------
// Everything that decides the look lives here; the room code below never names a colour or a texture value.
// Pick with ?style=name, the footer menu or the S key. Any number can be overridden from the URL: ?style=riso&wobble=.5&shift=2
const STYLES={
 riso:{label:'Riso (yumuşak)',
  ink:{blue:'#344a80',coral:'#ee6852',sun:'#ffd428',teal:'#008c8a',paper:'#f3ebdd'},
  ang:{blue:15,coral:75,sun:0,teal:45,paper:45}, // halftone screen angle per ink
  blend:'multiply',   // 'multiply' = inks darken light paper, 'screen' = inks glow on dark paper
  halftone:'dot',     // 'dot' | 'line'
  patScale:.175,      // halftone size (cell is 15.5px × this)
  soften:.35,         // 0 = hard dots, 1 = flat colour
  wear:1,             // misprint specks in the ink
  shift:1,            // plate misregistration multiplier
  wobble:.16,         // hand-drawn line wander in px
  outlineInk:'blue',outlineW:1,outlineTone:.9,
  shade:[.18,.38],    // darkening of the two side faces of every box
  grain:['rgba(120,96,70,.035)','rgba(255,255,255,.3)'], // paper specks
  tw:32,th:16,tz:32}, // projection: half tile width, half tile height, px per height unit
 hard:{label:'Riso (sert)',patScale:.2,soften:0,shift:1.72,wobble:.25},
 flat:{label:'Düz vektör',soften:1,wear:0,shift:0,wobble:0,outlineW:.75,grain:['rgba(0,0,0,0)','rgba(0,0,0,0)']},
 night:{label:'Gece / neon',blend:'screen',
  ink:{blue:'#3d5bd9',coral:'#ff5a7a',sun:'#ffe14d',teal:'#19d3c5',paper:'#0e1428'},
  shade:[.3,.55],shift:1.3,grain:['rgba(0,0,0,.25)','rgba(140,160,255,.05)'],ui:'#c9d4ff'},
 gravur:{label:'Gravür',halftone:'line',patScale:.15,soften:.1,wobble:.3,outlineW:1.1,shift:.6,
  ink:{blue:'#3b2a20',coral:'#a5522f',sun:'#d9a441',teal:'#5c6b4a',paper:'#e9dcc0'},
  ang:{blue:35,coral:-35,sun:0,teal:80,paper:45},grain:['rgba(70,45,20,.06)','rgba(255,250,235,.25)']},
 comic:{label:'Çizgi roman',patScale:.32,soften:0,wear:.3,shift:.5,wobble:.1,outlineW:2,outlineTone:1,shade:[.3,.55],
  ink:{blue:'#1b1b2f',coral:'#ff4b3a',sun:'#ffd000',teal:'#00a3d7',paper:'#fffdf5'}}
};
const SHIFT={blue:[.32,-.18],coral:[-.35,.26],sun:[.2,.44],teal:[-.26,-.32],paper:[0,0]};
let S,INK,ANG,B,VIEW_CY,styleName,patternCache;
function setStyle(name){
 styleName=STYLES[name]?name:'riso';S={...STYLES.riso,...STYLES[styleName]};
 for(const k in S)if(typeof S[k]==='number'&&QUERY.has(k)&&isFinite(parseFloat(QUERY.get(k))))S[k]=parseFloat(QUERY.get(k));
 INK=S.ink;ANG=S.ang;patternCache=new WeakMap();
 // Bounds of the cached room picture, derived from the projection so it can be changed freely.
 const x=-Math.ceil(12*S.tw+30),y=-Math.ceil(3.7*S.tz+38);B={x,y,w:-2*x,h:Math.ceil(24*S.th+.4*S.tz+30)-y};VIEW_CY=B.y+B.h/2-17;
 const css=document.documentElement.style;css.setProperty('--paper',INK.paper);css.setProperty('--ink',S.ui||INK.blue);css.setProperty('--accent',INK.coral);css.setProperty('--frame',INK.blue);
}
setStyle(QUERY.get('style'));
const p=(i,j,z=0)=>[(i-j)*S.tw,(i+j)*S.th-z*S.tz];
const tile=(i,j,w,d,z=0)=>[p(i,j,z),p(i+w,j,z),p(i+w,j+d,z),p(i,j+d,z)];
const faceI=(i,j,w,z,h)=>[p(i,j,z),p(i+w,j,z),p(i+w,j,z+h),p(i,j,z+h)];
const faceJ=(i,j,d,z,h)=>[p(i,j,z),p(i,j+d,z),p(i,j+d,z+h),p(i,j,z+h)];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(4238),rand=(a,b)=>a+R()*(b-a),ellipse=(x,y,rx,ry,n=32)=>Array.from({length:n},(_,k)=>[x+Math.cos(k/n*TAU)*rx,y+Math.sin(k/n*TAU)*ry]);
const rect=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
// ?legacy switches the per-frame shortcuts off (exact blending everywhere, no camera blit) for before/after comparison.
const LEGACY=QUERY.has('legacy');
// `fast` is on only while the per-frame layer is painted. Blending an ink over a canvas is what costs time, so there:
// fills that were just knocked out to paper use the ink colour already blended with paper (identical result, plain painting),
// and strokes of one ink are sent as a single path. The cached room is always built with exact blending.
let c=ctx,fast=false;
const rgb=hex=>[1,3,5].map(k=>parseInt(hex.slice(k,k+2),16));
function inkColor(ink,solid){const a=rgb(INK[ink]);if(!solid)return a;const P=rgb(INK.paper);return a.map((v,k)=>Math.round(S.blend==='screen'?255-(255-v)*(255-P[k])/255:v*P[k]/255))}
function pattern(ink,tone,solid=false){let bank=patternCache.get(c);if(!bank){bank=new Map();patternCache.set(c,bank)}const level=Math.max(1,Math.min(20,Math.round(tone*20))),key=ink+level+(solid?'s':'');if(bank.has(key))return bank.get(key);
 const cv=document.createElement('canvas');cv.width=cv.height=124;const g=cv.getContext('2d'),r=rng(129+level*97+ink.charCodeAt(0)),cell=15.5,t=level/20,color=inkColor(ink,solid);
 g.fillStyle=`rgb(${color})`;
 if(S.halftone==='line'){for(let y=0;y<8;y++)g.fillRect(0,y*cell,124,cell*Math.min(1,t*(t<1?.92+r()*.16:1)))}
 else{if(t>.5){g.fillRect(0,0,124,124);g.globalCompositeOperation='destination-out'}
  if(t<1)for(let y=0;y<=8;y++)for(let x=0;x<=8;x++){g.beginPath();const rad=cell*Math.sqrt((t>.5?1-t:t)/Math.PI)*(.86+r()*.24);g.arc((x+(t>.5?0:.5))*cell,(y+(t>.5?0:.5))*cell,rad,0,TAU);g.fill()}}
 g.globalCompositeOperation='destination-out';for(let k=0;k<105*S.wear;k++){g.globalAlpha=.25+r()*.6;g.fillRect(r()*124,r()*124,.7+r()*1.4,.7+r()*1.4)}
 // Blend the halftone toward its average opacity: retain print texture with gentler contrast.
 if(S.soften>0){const pixels=g.getImageData(0,0,124,124),data=pixels.data,s=Math.min(1,S.soften);
  for(let k=0;k<data.length;k+=4){data[k]=color[0];data[k+1]=color[1];data[k+2]=color[2];data[k+3]=Math.round(data[k+3]*(1-s)+t*255*s)}g.putImageData(pixels,0,0)}
 const out=c.createPattern(cv,'repeat');out.setTransform(new DOMMatrix().rotateSelf(ANG[ink]).scaleSelf(S.patScale));bank.set(key,out);return out;
}
function path(q,dx=0,dy=0){c.beginPath();q.forEach((a,k)=>k?c.lineTo(a[0]+dx,a[1]+dy):c.moveTo(a[0]+dx,a[1]+dy));c.closePath()}
function fill(q,ink='paper',tone=1,knock=true){if(!q.length)return;if(knock){path(q);c.fillStyle=INK.paper;c.fill()}if(tone<=0)return;const dx=SHIFT[ink][0]*S.shift,dy=SHIFT[ink][1]*S.shift;const solid=fast&&knock&&ink!=='paper';path(q,dx,dy);c.fillStyle=pattern(ink,tone,solid);c.globalCompositeOperation=ink==='paper'||solid?'source-over':S.blend;c.fill();c.globalCompositeOperation='source-over'}
// Darken an already painted area. On dark paper inks add light, so shadow is laid down with the paper colour instead.
function shade(q,tone){if(S.blend==='screen')fill(q,'paper',Math.min(1,tone*1.5),false);else fill(q,S.outlineInk,tone,false)}
function line(q,ink='blue',w=1,tone=1,closed=false){lines([q],ink,w,tone,closed)}
// Several polylines of one ink. Painted as one stroke while `fast`, otherwise one by one so overlaps print twice as on paper.
function lines(list,ink='blue',w=1,tone=1,closed=false){if(!fast&&list.length>1){for(const q of list)lines([q],ink,w,tone,closed);return}
 c.beginPath();const dx=SHIFT[ink][0]*S.shift,dy=SHIFT[ink][1]*S.shift;for(const q of list){for(let k=0;k<q.length;k++){const a=q[k];if(!k)c.moveTo(a[0]+dx,a[1]+dy);else{const b=q[k-1],n=Math.max(1,Math.ceil(Math.hypot(a[0]-b[0],a[1]-b[1])/5));for(let z=1;z<=n;z++){const f=z/n,off=Math.sin(f*Math.PI)*Math.sin(k*4.1+f*7)*S.wobble;c.lineTo(b[0]+(a[0]-b[0])*f+off+dx,b[1]+(a[1]-b[1])*f+off+dy)}}}if(closed)c.closePath()}c.strokeStyle=pattern(ink,tone);c.lineWidth=w;c.lineJoin=c.lineCap='round';c.globalCompositeOperation=ink==='paper'?'source-over':S.blend;c.stroke();c.globalCompositeOperation='source-over'}
function shape(q,ink,tone=1,w=.9){fill(q,ink,tone);line(q,S.outlineInk,w*S.outlineW,S.outlineTone,true)}
function clip(q,fn){c.save();path(q);c.clip();fn();c.restore()}
function dot(x,y,r,ink='sun',tone=1){fill(ellipse(x,y,r,r,10),ink,tone)}
function glow(x,y,rx,ry,ink='sun',power=.35){for(let k=7;k>0;k--)fill(ellipse(x,y,rx*k/7,ry*k/7),ink,power*(1-k/8),false)}
function box(i,j,w,d,z,h,ink='coral',tone=.6){const top=tile(i,j,w,d,z+h),a=faceI(i,j+d,w,z,h),b=faceJ(i+w,j,d,z,h);
 if(fast){fill(a,ink,tone);shade(a,S.shade[0]);fill(b,ink,tone);shade(b,S.shade[1]);fill(top,ink,tone*.85);lines([a,b,top],S.outlineInk,.9*S.outlineW,S.outlineTone,true);return top}
 shape(a,ink,tone);shade(a,S.shade[0]);shape(b,ink,tone);shade(b,S.shade[1]);shape(top,ink,tone*.85);return top}
function cable(q,ink='blue',w=1.7){line(q,'paper',w+1,.6);line(q,ink,w,.9)}
const screens=[];let serial=0;
function screen(side,start,offset,z,w,h,mode='code',bezel='blue',tone=.88){
 const P=(u,v)=>side==='i'?p(start+u*w,offset,z+v*h):p(offset,start+u*w,z+v*h);
 const outer=[P(0,0),P(1,0),P(1,1),P(0,1)];shape(outer,bezel,tone,1.2);
 const inner=[P(.065,.13),P(.9,.13),P(.9,.93),P(.065,.93)];shape(inner,'blue',.98,.65);fill(inner,'teal',.22,false);
 line([P(.07,.965),P(.94,.965)],'paper',.7,.5);const led=P(.95,.07);dot(...led,1.25,'sun');
 screens.push({P,inner,outer,mode,id:serial++});return P;
}
function wallLabel(side,start,z,text,size=5.5){const q=side==='i'?p(start,.04,z):p(.04,start,z);c.save();c.translate(...q);c.transform(side==='i'?1:-1,.5,0,1,0,0);c.font=`${size}px monospace`;c.fillStyle=INK.paper;c.fillText(text,0,0);c.restore()}
function keyboard(i,j,w=1.12,d=.4,z=1.02){shape(tile(i,j,w,d,z),'paper',1,.7);for(let a=0;a<10;a++)for(let b=0;b<3;b++)fill(tile(i+.06+a*w*.088,j+.035+b*.1,w*.058,.06,z+.005),a===9?'coral':'blue',.6);line([p(i+.28,j+.34,z+.01),p(i+.8,j+.34,z+.01)],'blue',1.8,.65)}
function mug(i,j,z){const [x,y]=p(i,j,z);shape(rect(x-4,y-9,8,9),'paper',1);fill(rect(x-3,y-7,6,5),'coral',.55,false);line(ellipse(x+5,y-5,3,3,14),'blue',.8,1,true);shape(ellipse(x,y-9,4,1.7),'blue',.8,.6)}
function plant(i,j,z=0,s=1){const [x,y]=p(i,j,z);shape([[x-7*s,y-12*s],[x+7*s,y-12*s],[x+5*s,y],[x-5*s,y]],'coral',.75);for(let k=0;k<7;k++){const a=-Math.PI/2+(k-3)*.33,L=(17+(k%3)*5)*s,tx=x+Math.cos(a)*L,ty=y-11*s+Math.sin(a)*L;shape([[x,y-11*s],[tx-5*s,ty+7*s],[tx,ty],[tx+4*s,ty+8*s]],'teal',.65+(k%2)*.15,.7)}}
function speaker(i,j,z,w=.5,h=.9){box(i,j,w,.38,z,h,'blue',.8);const P=(u,v)=>p(i+u*w,j+.385,z+v*h);for(const [v,r] of[[.3,5],[.75,2.7]]){const [x,y]=P(.5,v);shape(ellipse(x,y,r,r*.9),'blue',1,.6);line(ellipse(x,y,r*.6,r*.54),'paper',.6,.7,true);dot(x,y,1.1,'coral',.8)}}
function desk(i,j,w,d,z=1){for(const a of[.12,w-.26])for(const b of[.12,d-.26])box(i+a,j+b,.13,.13,0,z-.13,'teal',.7);box(i,j,w,d,z-.13,.13,'coral',.55);for(let k=0;k<5;k++)line([p(i+.06,j+.13+k*d/5,z+.004),p(i+w-.06,j+.15+k*d/5,z+.004)],'blue',.5,.25)}
function monitor(i,j,w=1.6,h=1,z=1,mode='code'){box(i+w*.4,j+.05,w*.22,.35,z,.045,'blue',.7);line([p(i+w*.5,j+.15,z),p(i+w*.5,j+.15,z+.32)],'blue',3);screen('i',i,j+.14,z+.3,w,h,mode);}
const props=[];const at=(i,j,fn)=>props.push({key:i+j,fn});
function buildRoom(){
 screens.length=0;serial=0;props.length=0;
 box(0,0,12,12,-.4,.4,'blue',.6);fill(tile(0,0,12,12),'teal',.23,false);
 for(let a=0;a<=12;a++){line([p(a,0),p(a,12)],'blue',.65,.38);line([p(0,a),p(12,a)],'blue',.65,.38)}
 for(let a=0;a<12;a++)for(let b=0;b<12;b++)if((a+b)%2===0)shade(tile(a+.035,b+.035,.93,.93),.06);
 shape(faceJ(0,0,12,0,3.4),'blue',.72);fill(faceJ(0,0,12,0,3.4),'teal',.24,false);
 shape(faceI(0,0,12,0,3.4),'blue',.8);
 box(-.13,-.13,.13,12.13,3.4,.12,'coral',.55);box(0,-.13,12,.13,3.4,.12,'coral',.5);
 line([p(0,11.8,.12),p(0,0,.12),p(11.8,0,.12)],'coral',3,.75);
 for(let a=1;a<12;a++){line([p(0,a,.2),p(0,a,3.4)],'paper',.6,.12);line([p(a,0,.2),p(a,0,3.4)],'paper',.6,.12)}
 // Wall-mounted monitor array: surveillance, diagrams, terminal and waveform.
 for(let row=0;row<2;row++)for(let k=0;k<3;k++){const pos=.7+k*2.12;screen('j',pos,.05,1.3+row*1.03,1.94,.88,['code','wave','map','bars','orbit','grid'][row*3+k]);}
 wallLabel('j',.8,3.25,'SIGNAL ARCHIVE / 06',5);
 for(const k of[1.2,3.4,5.6])cable([p(.06,k,1.27),p(.07,k,1.05),p(.07,k+.3,.9),p(.08,k+.3,.3)],'coral',1.1);
 screen('i',1.1,.06,1.63,4.55,1.48,'map');wallLabel('i',1.25,3.27,'NETWORK / NIGHT SHIFT',5.6);
 screen('i',6.1,.06,2.3,2.35,.84,'bars','paper',.8);screen('i',8.85,.06,2.3,2.35,.84,'wave');
 line([p(6,.08,2.14),p(11.3,.08,2.14)],'sun',2.3,.85);
 // Patchboard behind the workbench.
 shape(faceI(6.1,.04,5.1,1.38,.54),'teal',.6);
 for(let a=0;a<14;a++){const [x,y]=p(6.3+a*.34,.07,1.68);dot(x,y,1.6,a%4===0?'sun':'paper',.9);const [x2,y2]=p(6.3+a*.34,.08,1.49);dot(x2,y2,1.5,'blue');if(a%3===0)cable([[x,y],[x+2,y+7],[x2+8,y2+8],[x2,y2]],'coral',1.15)}
 // Back workbench and smaller computers.
 at(7,1.3,()=>{desk(6,.45,5.35,1.2,.97);monitor(6.2,.75,1.55,.83,.97,'code');monitor(8,.75,1.35,.83,.97,'grid');keyboard(6.4,1.2,1.15,.4,.98);keyboard(8.1,1.22,1,.4,.98);speaker(10.1,.77,.97,.5,.77);mug(9.75,1.33,.98);box(10.8,.6,.36,.65,.98,.14,'sun',.8);});
 // Server rack, open front with vents and patch cables.
 at(.8,8.4,()=>{box(.25,7.45,.82,2.35,0,2.85,'blue',.86);shape(faceJ(1.08,7.55,2.15,.14,2.57),'blue',1);
 for(let r=0;r<8;r++){const z=.23+r*.29;shape(faceJ(1.095,7.64,1.96,z,.22),'teal',.45,.65);for(let n=0;n<7;n++)line([p(1.11,7.76+n*.18,z+.06),p(1.11,7.76+n*.18,z+.17)],'blue',.9);for(let n=0;n<3;n++)dot(...p(1.12,9.13+n*.13,z+.12),1,n===0?'coral':'sun');}
 for(let k=0;k<5;k++)cable([p(1.13,7.8+k*.25,2.45),p(1.18,7.8+k*.25,1.9),p(1.18,8.5+k*.13,1.7),p(1.13,8.55+k*.13,1.18)],k%2?'sun':'coral',1.2);
 box(.32,7.6,.6,.6,2.85,.14,'paper',.8);plant(.66,9.35,2.85,.62);
