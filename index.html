<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>theroom — kendi kripto ofisini kur</title>
<style>
:root{--paper:#f3ebdd;--ink:#344a80;--accent:#ee6852;--frame:#344a80;--line:color-mix(in srgb,var(--ink) 25%,transparent);--panel:color-mix(in srgb,var(--paper) 90%,transparent)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
canvas#stage{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas#stage.drag{cursor:grabbing}
button,select{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 80%,transparent);color:var(--ink);padding:8px 12px;font:11px monospace;border-radius:2px}
button{cursor:pointer}select{max-width:150px;padding:8px;background:var(--paper)}
button:hover:not(:disabled){background:color-mix(in srgb,var(--paper) 86%,var(--ink))}button:focus-visible,select:focus-visible{outline:2px solid var(--accent)}

/* brand */
header{position:fixed;left:28px;top:22px;display:flex;align-items:center;gap:11px;pointer-events:none}
#logo-mark{width:52px;height:52px;display:block}
h1{margin:0;font:600 23px/1 Georgia,serif;letter-spacing:.5px}h1 em{font-style:italic;color:var(--accent)}
header small{display:block;margin-top:4px;font:9px/1.4 monospace;letter-spacing:2.4px;text-transform:uppercase;opacity:.65}

/* profile */
#profile{position:fixed;right:20px;top:20px;display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(3px)}
#avatar{width:34px;height:34px;display:block;border:1px solid var(--line);border-radius:3px}
#profile .who{display:flex;flex-direction:column;gap:3px;min-width:104px}
#player-name{font:11px monospace;letter-spacing:.4px}
#player-stats{font:11px monospace;opacity:.8;white-space:nowrap}
#player-stats b{font-weight:400;color:var(--accent)}
#connect{padding:7px 9px;font-size:10px}

footer{position:fixed;bottom:22px;left:28px;right:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font:11px monospace;color:color-mix(in srgb,var(--ink) 67%,transparent)}
footer>div{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
#edit[aria-pressed=true]{background:var(--ink);color:var(--paper)}
#toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,6px);padding:8px 14px;font:11px monospace;background:var(--ink);color:var(--paper);border-radius:3px;opacity:0;transition:opacity .16s,transform .16s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hud{position:fixed;left:28px;top:96px;margin:0;padding:10px 12px;font:11px/1.55 monospace;white-space:pre;pointer-events:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:2px}#hud:empty{display:none}

/* panel */
#catalog{display:none;position:fixed;right:20px;top:86px;bottom:74px;width:262px;flex-direction:column;gap:8px;padding:12px;background:color-mix(in srgb,var(--paper) 92%,transparent);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(3px)}
body.editing #catalog{display:flex}
#catalog p{font:10px/1.5 monospace;margin:0;opacity:.7}
#catalog-list{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start;padding-right:2px}
#tabs{display:flex;gap:3px}#tabs button{flex:1;padding:7px 1px;font-size:9.5px;white-space:nowrap}#tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:5px;text-align:left;background:var(--paper)}
.card canvas{width:100%;height:auto;aspect-ratio:108/78;display:block;border-radius:1px}.card span{font:10px/1.3 monospace}.card small{font-size:8px;letter-spacing:1px}
.card b{position:absolute;right:5px;top:5px;padding:1px 5px;font:10px monospace;background:var(--paper);border:1px solid var(--line);border-radius:2px}.card:disabled{opacity:.45;cursor:default}
.card.rare{border-color:var(--accent)}.card.epic{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#catalog-list.rows{display:flex;flex-direction:column;gap:4px}
.row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;font:10px/1.4 monospace;border:1px solid var(--line);border-radius:2px;background:var(--paper)}
.row.head,.row.note{border:0;background:none;padding:6px 2px 0;opacity:.75}.row.head{letter-spacing:1px;text-transform:uppercase;font-size:9px}
.row button{padding:4px 8px}.row em{font-style:normal;white-space:nowrap}.row small{display:block;letter-spacing:0;text-transform:none;opacity:.7}
.row.claimed{opacity:.55}.row.ready{border-color:var(--accent)}.row.total{font-size:12px;border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:4px}.opt{display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:10px}.opt i{width:11px;height:11px;border:1px solid var(--line);border-radius:50%}
.opt[aria-pressed=true]{background:var(--ink);color:var(--paper)}.opt.armed{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
body.game #style-picker{display:none}
#catalog .tools{display:flex;gap:4px}#catalog .tools button{flex:1;padding:7px 4px}

dialog{width:min(700px,92vw);padding:24px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);box-shadow:0 24px 80px #18243b40}dialog::backdrop{background:#17233c99;backdrop-filter:blur(3px)}
.screen-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.screen-heading h2{font:italic 24px Georgia,serif;margin:0}
#screen-view{width:100%;height:auto;aspect-ratio:360/220;margin-top:20px;border:8px solid var(--frame);border-radius:4px;cursor:default}dialog p{font:12px/1.6 monospace;margin-bottom:0;opacity:.7}

@media(max-width:820px){#profile .who{min-width:0}#connect{display:none}}
@media(max-width:700px){header{left:16px;top:14px;gap:8px}#logo-mark{width:40px;height:40px}h1{font-size:19px}header small{letter-spacing:1.8px}
 #profile{right:12px;top:12px;padding:6px 8px;gap:7px}#avatar{width:28px;height:28px}#player-name,#player-stats{font-size:10px}
 footer{left:14px;right:12px;bottom:12px}footer>span{display:none}select{max-width:112px}dialog{padding:16px}#hud{left:14px;top:78px;font-size:9px}#toast{bottom:62px}
 /* a bottom sheet that scrolls vertically like the desktop panel, so full-width rows still work */
 #catalog{left:12px;right:12px;top:auto;bottom:58px;width:auto;height:308px}#catalog p{display:none}}
</style>
<canvas id="stage" aria-label="Risograf baskı tarzında, düzenlenebilir izometrik kripto ofisi"></canvas>
<header><canvas id="logo-mark" aria-hidden="true"></canvas><div><h1>the<em>room</em></h1><small id="tagline">kendi kripto ofisini kur</small></div></header>
<aside id="profile" aria-label="Profil">
 <canvas id="avatar" aria-hidden="true"></canvas>
 <div class="who"><span id="player-name"></span><span id="player-stats"></span></div>
 <button id="connect">Cüzdan bağla</button>
</aside>
<footer><span id="hint">Sürükle · Yakınlaş · Bir ekrana tıkla</span><div><select id="style-picker" aria-label="Çizim stili" title="Çizim stili (S: sıradaki)"></select> <select id="screen-picker" aria-label="İncelenecek ekran"><option value="">Ekran seç…</option></select> <button id="motion" aria-pressed="false">Hareketi durdur</button> <button id="reset">Ortala ↗</button> <button id="edit" aria-pressed="false" title="Düzenleme modu (E)">Düzenle ✎</button></div></footer>
<aside id="catalog" aria-label="Envanter, mağaza ve görevler"><div id="tabs"></div><p>Bir eşyaya tıkla, sonra odada yerine tıkla. Küçük eşyalar masaların ve rafların üstüne konabilir.</p><div id="catalog-list"></div><div class="tools"><button id="empty-room">Odayı boşalt</button><button id="reset-room">Odayı sıfırla</button></div></aside>
<div id="toast" role="status" aria-live="polite"></div>
<pre id="hud" aria-live="off"></pre>
<dialog id="screen-dialog" aria-labelledby="screen-title"><div class="screen-heading"><h2 id="screen-title">Ekran</h2><button id="screen-close" autofocus aria-label="Ekran penceresini kapat">Kapat ×</button></div><canvas id="screen-view" width="1080" height="660" role="img" aria-label="Seçilen ekranın büyütülmüş içeriği"></canvas><p>Odadaki ekranın canlı görünümü · Kapatmak için Esc</p></dialog>
<script src="js/engine.js"></script>
<script src="js/items.js"></script>
<script src="js/items-desk.js"></script>
<script src="js/items-crypto.js"></script>
<script src="js/items-lab.js"></script>
<script src="js/items-office.js"></script>
<script src="js/room.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</html>
