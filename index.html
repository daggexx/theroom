<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gece vardiyası — bilgisayar odası</title>
<style>
:root{--paper:#f3ebdd;--ink:#344a80;--accent:#ee6852;--frame:#344a80;--line:color-mix(in srgb,var(--ink) 25%,transparent)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
canvas#stage{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas#stage.drag{cursor:grabbing}
header{position:fixed;left:32px;top:26px;pointer-events:none}small{font:10px/1.5 monospace;letter-spacing:3px;text-transform:uppercase;opacity:.6}h1{font:italic 25px Georgia,serif;margin:7px 0}
#wallet{font:12px monospace;margin-top:2px}#selection{font:11px monospace;min-height:16px;opacity:.8;margin-top:6px}
footer{position:fixed;bottom:22px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:11px monospace;color:color-mix(in srgb,var(--ink) 67%,transparent)}
footer>div{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
button,select{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 80%,transparent);color:var(--ink);padding:8px 12px;font:11px monospace;border-radius:2px}
button{cursor:pointer}select{max-width:160px;padding:8px;background:var(--paper)}
button:hover{background:color-mix(in srgb,var(--paper) 86%,var(--ink))}button:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
#edit[aria-pressed=true]{background:var(--ink);color:var(--paper)}
#hud{position:fixed;left:32px;top:112px;margin:0;padding:10px 12px;font:11px/1.55 monospace;white-space:pre;pointer-events:none;color:var(--ink);background:color-mix(in srgb,var(--paper) 88%,transparent);border:1px solid var(--line);border-radius:2px}#hud:empty{display:none}
#catalog{display:none;position:fixed;right:20px;top:20px;bottom:76px;width:258px;flex-direction:column;gap:8px;padding:12px;background:color-mix(in srgb,var(--paper) 92%,transparent);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(3px)}
body.editing #catalog{display:flex}
#catalog h2{font:italic 18px Georgia,serif;margin:0}#catalog p{font:10px/1.5 monospace;margin:0;opacity:.7}
#catalog-list{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start;padding-right:2px}
.card{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:5px;text-align:left;background:var(--paper)}
.card canvas{width:100%;height:auto;aspect-ratio:108/78;display:block;border-radius:1px}.card span{font:10px/1.3 monospace}.card small{font-size:8px;letter-spacing:1px}
#tabs{display:flex;gap:3px}#tabs button{flex:1;padding:7px 1px;font-size:9.5px;white-space:nowrap}#tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.card{position:relative}.card b{position:absolute;right:5px;top:5px;padding:1px 5px;font:10px monospace;background:var(--paper);border:1px solid var(--line);border-radius:2px}.card:disabled{opacity:.45;cursor:default}
.card.rare{border-color:var(--accent)}.card.epic{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#catalog-list.rows{display:flex;flex-direction:column;gap:4px}.row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;font:10px/1.4 monospace;border:1px solid var(--line);border-radius:2px;background:var(--paper)}
.row.head,.row.note{border:0;background:none;padding:6px 2px 0;opacity:.75}.row.head{letter-spacing:1px;text-transform:uppercase;font-size:9px}.row button{padding:4px 8px}.row em{font-style:normal;white-space:nowrap}.row small{display:block;letter-spacing:0;text-transform:none;opacity:.7}
.row.claimed{opacity:.55}.row.ready{border-color:var(--accent)}.row.total{font-size:12px;border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:4px}.opt{display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:10px}.opt i{width:11px;height:11px;border:1px solid var(--line);border-radius:50%}.opt[aria-pressed=true]{background:var(--ink);color:var(--paper)}.opt.armed{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
body.game #style-picker{display:none}
#catalog .tools{display:flex;gap:4px}#catalog .tools button{flex:1;padding:7px 4px}
dialog{width:min(700px,92vw);padding:24px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);box-shadow:0 24px 80px #18243b40}dialog::backdrop{background:#17233c99;backdrop-filter:blur(3px)}
.screen-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.screen-heading h2{font:italic 24px Georgia,serif;margin:0}
#screen-view{width:100%;height:auto;aspect-ratio:360/220;margin-top:20px;border:8px solid var(--frame);border-radius:4px;cursor:default}dialog p{font:12px/1.6 monospace;margin-bottom:0;opacity:.7}
@media(max-width:700px){header{left:20px;top:18px}h1{font-size:21px}footer{left:16px;right:16px;bottom:14px}footer span{display:none}select{max-width:118px}dialog{padding:16px}#hud{left:16px;top:96px;font-size:9px}
 #catalog{left:12px;right:12px;top:auto;bottom:64px;width:auto;height:178px}#catalog p{display:none}#catalog-list{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:96px;overflow:auto hidden}}
</style>
<canvas id="stage" aria-label="Risograf baskı tarzında, düzenlenebilir izometrik bilgisayar odası"></canvas>
<header><small>Oda çalışması / 01</small><h1>Gece vardiyası</h1><div id="wallet"></div><div id="selection" aria-live="polite"></div></header>
<footer><span id="hint">Sürükle · Yakınlaş · Bir ekrana tıkla</span><div><select id="style-picker" aria-label="Çizim stili" title="Çizim stili (S: sıradaki)"></select> <select id="screen-picker" aria-label="İncelenecek ekran"><option value="">Ekran seç…</option></select> <button id="motion" aria-pressed="false">Hareketi durdur</button> <button id="reset">Ortala ↗</button> <button id="edit" aria-pressed="false" title="Düzenleme modu (E)">Düzenle ✎</button></div></footer>
<aside id="catalog" aria-label="Envanter, mağaza ve görevler"><div id="tabs"></div><p>Bir eşyaya tıkla, sonra odada yerine tıkla. Küçük eşyalar masaların ve kasaların üstüne konabilir.</p><div id="catalog-list"></div><div class="tools"><button id="empty-room">Odayı boşalt</button><button id="reset-room">Odayı sıfırla</button></div></aside>
<pre id="hud" aria-live="off"></pre>
<dialog id="screen-dialog" aria-labelledby="screen-title"><div class="screen-heading"><h2 id="screen-title">Ekran</h2><button id="screen-close" autofocus aria-label="Ekran penceresini kapat">Kapat ×</button></div><canvas id="screen-view" width="1080" height="660" role="img" aria-label="Seçilen ekranın büyütülmüş içeriği"></canvas><p>Odadaki ekranın canlı görünümü · Kapatmak için Esc</p></dialog>
<script src="js/engine.js"></script>
<script src="js/items.js"></script>
<script src="js/items-home.js"></script>
<script src="js/room.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</html>
